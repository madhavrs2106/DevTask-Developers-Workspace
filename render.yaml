# Render Blueprint — deploys DevTask as a single Node service + managed Postgres.
# Docs: https://render.com/docs/blueprint-spec
#
# One-click: push this repo to GitHub → Render Dashboard → New → Blueprint.

services:
  - type: web
    name: devtask
    runtime: node
    plan: free
    region: oregon
    branch: main
    # --include=dev keeps tooling (prisma CLI, vite, tsc) installed even with NODE_ENV=production
    buildCommand: npm install --include=dev --no-audit --no-fund && npx prisma generate --schema=prisma/schema.prisma && npx prisma migrate deploy --schema=prisma/schema.prisma && python3 -m pip install --quiet -r server/judge-requirements.txt && npm run build -w client
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Pin the Node runtime for reproducible builds
      - key: NODE_VERSION
        value: 22
      # DATABASE_URL is set manually in the dashboard to your external Postgres
      # (e.g., Supabase) connection string. No Render-managed database is used.
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Seeds demo data on first boot only (empty database). Set to "false" to disable.
      - key: AUTO_SEED
        value: "true"
      # Set to "true" once to reset demo account, then back to "false"
      - key: FORCE_SEED
        value: "false"
